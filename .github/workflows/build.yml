name: vidExtractor CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    env:
      MQHOST: localhost
      MQUSER: merUser
      MQPASS: passwordMER
      MQPORT: 5672
      MNG_PORT: 15672
      OUTPUT_FOLDER: /tmp/audios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup RabbitMQ Image
        uses: mer-team/rabbitmq-mng-action@v1.2
        with:
          RABBITMQ_USER: ${{ env.MQUSER }}
          RABBITMQ_PASS: ${{ env.MQPASS }}
          RABBITMQ_PORT: ${{ env.MQPORT }}
          RABBITMQ_MNG_PORT: ${{ env.MNG_PORT }}
          RABBITMQ_TAG: '3-management-alpine'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v2
        with:
          dockerfile: |
            Dockerfile
            .devcontainer/Dockerfile

      - name: Create output directory
        run: mkdir -p ${{ env.OUTPUT_FOLDER }}

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run prettier

      - name: Run tests
        run: npm test
        env:
          RABBITMQ_HOST: ${{ env.MQHOST }}
          RABBITMQ_PORT: ${{ env.MQPORT }}
          RABBITMQ_USER: ${{ env.MQUSER }}
          RABBITMQ_PASS: ${{ env.MQPASS }}
          OUTPUT_FOLDER: ${{ env.OUTPUT_FOLDER }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: vidextractor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v1
