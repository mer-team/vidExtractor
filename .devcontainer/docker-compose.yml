services:
  vid-extractor:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/vid-extractor:cached
    #  - ../audios:/workspaces/vid-extractor/audios
    environment:
      NODE_ENV: development
    env_file:
      - ../.env
    networks:
      - mermaid-dev-network
    command: sleep infinity

networks:
  mermaid-dev-network:
    external: true
